<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1583" viewBox="0 0 1440 1583" role="img" aria-labelledby="title desc">
<title id="title">From a report to an answer you can verify</title><desc id="desc">A demonstration follows this route. Later views open each step and show the responsible files. Blue cards describe the main flow; amber cards explain safeguards. Source comments use the same node IDs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text {font-family:'Segoe UI','Microsoft JhengHei',Arial,sans-serif} text,polyline {pointer-events:none}</style>
<rect width="100%" height="100%" fill="#f4f7fa"/>
<text x="48" y="38" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#245f81">FAMILY MEDICAL RECORDS · VIEW 00</text>
<text x="48" y="80" font-family="Segoe UI,Arial" font-size="30" font-weight="600" fill="#233646">From a report to an answer you can verify</text>
<text x="48" y="111" font-family="Segoe UI,Arial" font-size="16" fill="#5c6d7c">A demonstration follows this route. Later views open each step and show the responsible files.</text>
<text x="48" y="143" font-family="Segoe UI,Arial" font-size="13" fill="#5c6d7c">Read top to bottom. Solid blue = sequence/call; dashed amber = related safeguard, not an extra processing stage.</text>
<g id="F1" data-node="F1" data-x="48" data-y="180" data-width="740" data-height="160">
<rect x="48" y="180" width="740" height="160" rx="14" fill="#ffffff" stroke="#bfccd8"/>
<text x="70" y="207" font-size="13" fill="#245f81" font-weight="700">F1</text>
<text x="70" y="237" font-size="21" fill="#233646" font-weight="600">Add the report you already have</text>
<text x="70" y="264" font-size="13" fill="#5c6d7c" font-weight="400">ImportPanel.tsx → POST /api/imports or /api/texts</text>
<text x="70" y="291" font-size="16" fill="#233646" font-weight="400">Choose a photo, PDF, UTF-8 file, or write a text draft. Upload/save starts</text>
<text x="70" y="315" font-size="16" fill="#233646" font-weight="400">processing without another confirmation.</text>
</g>
<g id="F1G" data-node="F1G" data-x="876" data-y="180" data-width="516" data-height="184">
<rect x="876" y="180" width="516" height="184" rx="14" fill="#fff6e9" stroke="#dcbb83"/>
<text x="898" y="207" font-size="13" fill="#98621e" font-weight="700">F1G</text>
<text x="898" y="237" font-size="21" fill="#233646" font-weight="600">Why store before asking AI?</text>
<text x="898" y="264" font-size="13" fill="#5c6d7c" font-weight="400">api.py → Library.create</text>
<text x="898" y="291" font-size="16" fill="#233646" font-weight="400">A slow or unavailable AI service must not lose the</text>
<text x="898" y="315" font-size="16" fill="#233646" font-weight="400">original. A queued receipt is not a completed</text>
<text x="898" y="339" font-size="16" fill="#233646" font-weight="400">extraction.</text>
</g>
<polyline data-edge="true" points="788,245 876,245" fill="none" stroke="#98621e" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<g id="F2" data-node="F2" data-x="48" data-y="412" data-width="740" data-height="160">
<rect x="48" y="412" width="740" height="160" rx="14" fill="#ffffff" stroke="#bfccd8"/>
<text x="70" y="439" font-size="13" fill="#245f81" font-weight="700">F2</text>
<text x="70" y="469" font-size="21" fill="#233646" font-weight="600">Extract, check, and file</text>
<text x="70" y="496" font-size="13" fill="#5c6d7c" font-weight="400">filing.py → processing.py → Library.change</text>
<text x="70" y="523" font-size="16" fill="#233646" font-weight="400">Read text, preserve its first extraction, flag suspected text errors, and</text>
<text x="70" y="547" font-size="16" fill="#233646" font-weight="400">propose categories with source quotes. See import-pipeline.svg.</text>
</g>
<polyline data-edge="true" points="418,340 418,412" fill="none" stroke="#245f81" stroke-width="2" marker-end="url(#arrow)"/>
<g id="F2G" data-node="F2G" data-x="876" data-y="412" data-width="516" data-height="184">
<rect x="876" y="412" width="516" height="184" rx="14" fill="#fff6e9" stroke="#dcbb83"/>
<text x="898" y="439" font-size="13" fill="#98621e" font-weight="700">F2G</text>
<text x="898" y="469" font-size="21" fill="#233646" font-weight="600">Why separate the outcomes?</text>
<text x="898" y="496" font-size="13" fill="#5c6d7c" font-weight="400">document_processing + document_metadata</text>
<text x="898" y="523" font-size="16" fill="#233646" font-weight="400">A failed text check can coexist with filed metadata.</text>
<text x="898" y="547" font-size="16" fill="#233646" font-weight="400">Missing facts remain unknown; the app does not invent</text>
<text x="898" y="571" font-size="16" fill="#233646" font-weight="400">them.</text>
</g>
<polyline data-edge="true" points="788,477 876,477" fill="none" stroke="#98621e" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<g id="F3" data-node="F3" data-x="48" data-y="644" data-width="740" data-height="160">
<rect x="48" y="644" width="740" height="160" rx="14" fill="#ffffff" stroke="#bfccd8"/>
<text x="70" y="671" font-size="13" fill="#245f81" font-weight="700">F3</text>
<text x="70" y="701" font-size="21" fill="#233646" font-weight="600">Review the report and correct mistakes</text>
<text x="70" y="728" font-size="13" fill="#5c6d7c" font-weight="400">Viewer.tsx → api.manual / api.recheck</text>
<text x="70" y="755" font-size="16" fill="#233646" font-weight="400">Compare saved text with the original. Save your corrections, then explicitly</text>
<text x="70" y="779" font-size="16" fill="#233646" font-weight="400">recheck the saved version. See ui-flow.svg.</text>
</g>
<polyline data-edge="true" points="418,572 418,644" fill="none" stroke="#245f81" stroke-width="2" marker-end="url(#arrow)"/>
<g id="F3G" data-node="F3G" data-x="876" data-y="644" data-width="516" data-height="184">
<rect x="876" y="644" width="516" height="184" rx="14" fill="#fff6e9" stroke="#dcbb83"/>
<text x="898" y="671" font-size="13" fill="#98621e" font-weight="700">F3G</text>
<text x="898" y="701" font-size="21" fill="#233646" font-weight="600">Why keep the original?</text>
<text x="898" y="728" font-size="13" fill="#5c6d7c" font-weight="400">document_sources + document_texts</text>
<text x="898" y="755" font-size="16" fill="#233646" font-weight="400">Human corrections must not overwrite the original</text>
<text x="898" y="779" font-size="16" fill="#233646" font-weight="400">bytes or first extraction. Edits make old checks</text>
<text x="898" y="803" font-size="16" fill="#233646" font-weight="400">stale.</text>
</g>
<polyline data-edge="true" points="788,709 876,709" fill="none" stroke="#98621e" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<g id="F4" data-node="F4" data-x="48" data-y="876" data-width="740" data-height="160">
<rect x="48" y="876" width="740" height="160" rx="14" fill="#ffffff" stroke="#bfccd8"/>
<text x="70" y="903" font-size="13" fill="#245f81" font-weight="700">F4</text>
<text x="70" y="933" font-size="21" fill="#233646" font-weight="600">Find relevant records</text>
<text x="70" y="960" font-size="13" fill="#5c6d7c" font-weight="400">LibraryBrowser.tsx → browsing.ts + dates.ts</text>
<text x="70" y="987" font-size="16" fill="#233646" font-weight="400">Filter a family member and expand Member, Department, or Date groups. Browse</text>
<text x="70" y="1011" font-size="16" fill="#233646" font-weight="400">without an AI call. See browsing-flow.svg.</text>
</g>
<polyline data-edge="true" points="418,804 418,876" fill="none" stroke="#245f81" stroke-width="2" marker-end="url(#arrow)"/>
<g id="F4G" data-node="F4G" data-x="876" data-y="876" data-width="516" data-height="184">
<rect x="876" y="876" width="516" height="184" rx="14" fill="#fff6e9" stroke="#dcbb83"/>
<text x="898" y="903" font-size="13" fill="#98621e" font-weight="700">F4G</text>
<text x="898" y="933" font-size="21" fill="#233646" font-weight="600">Why display unresolved groups?</text>
<text x="898" y="960" font-size="13" fill="#5c6d7c" font-weight="400">memberIdentity / fileBranches</text>
<text x="898" y="987" font-size="16" fill="#233646" font-weight="400">Ambiguous people and incomplete dates must not</text>
<text x="898" y="1011" font-size="16" fill="#233646" font-weight="400">silently become confirmed ownership or a fabricated</text>
<text x="898" y="1035" font-size="16" fill="#233646" font-weight="400">chronology.</text>
</g>
<polyline data-edge="true" points="788,941 876,941" fill="none" stroke="#98621e" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<g id="F5" data-node="F5" data-x="48" data-y="1108" data-width="740" data-height="160">
<rect x="48" y="1108" width="740" height="160" rx="14" fill="#ffffff" stroke="#bfccd8"/>
<text x="70" y="1135" font-size="13" fill="#245f81" font-weight="700">F5</text>
<text x="70" y="1165" font-size="21" fill="#233646" font-weight="600">Ask a question in everyday language</text>
<text x="70" y="1192" font-size="13" fill="#5c6d7c" font-weight="400">ChatPanel.tsx → api.ask → chat.py</text>
<text x="70" y="1219" font-size="16" fill="#233646" font-weight="400">The backend supplies a scoped catalog; the model reads relevant saved reports</text>
<text x="70" y="1243" font-size="16" fill="#233646" font-weight="400">using constrained tools. See chat-flow.svg.</text>
</g>
<polyline data-edge="true" points="418,1036 418,1108" fill="none" stroke="#245f81" stroke-width="2" marker-end="url(#arrow)"/>
<g id="F5G" data-node="F5G" data-x="876" data-y="1108" data-width="516" data-height="184">
<rect x="876" y="1108" width="516" height="184" rx="14" fill="#fff6e9" stroke="#dcbb83"/>
<text x="898" y="1135" font-size="13" fill="#98621e" font-weight="700">F5G</text>
<text x="898" y="1165" font-size="21" fill="#233646" font-weight="600">Why retrieve each time?</text>
<text x="898" y="1192" font-size="13" fill="#5c6d7c" font-weight="400">chat.scope_files + revision checks</text>
<text x="898" y="1219" font-size="16" fill="#233646" font-weight="400">Conversation history is context, not fresh evidence.</text>
<text x="898" y="1243" font-size="16" fill="#233646" font-weight="400">New answers must use the selected member and current</text>
<text x="898" y="1267" font-size="16" fill="#233646" font-weight="400">saved records.</text>
</g>
<polyline data-edge="true" points="788,1173 876,1173" fill="none" stroke="#98621e" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<g id="F6" data-node="F6" data-x="48" data-y="1340" data-width="740" data-height="160">
<rect x="48" y="1340" width="740" height="160" rx="14" fill="#ffffff" stroke="#bfccd8"/>
<text x="70" y="1367" font-size="13" fill="#245f81" font-weight="700">F6</text>
<text x="70" y="1397" font-size="21" fill="#233646" font-weight="600">Open the evidence behind the answer</text>
<text x="70" y="1424" font-size="13" fill="#5c6d7c" font-weight="400">ChatPanel Sources → App.select → Viewer</text>
<text x="70" y="1451" font-size="16" fill="#233646" font-weight="400">Read an answer and its limits, follow its source link, then compare the original</text>
<text x="70" y="1475" font-size="16" fill="#233646" font-weight="400">report during your visit.</text>
</g>
<polyline data-edge="true" points="418,1268 418,1340" fill="none" stroke="#245f81" stroke-width="2" marker-end="url(#arrow)"/>
<g id="F6G" data-node="F6G" data-x="876" data-y="1340" data-width="516" data-height="160">
<rect x="876" y="1340" width="516" height="160" rx="14" fill="#fff6e9" stroke="#dcbb83"/>
<text x="898" y="1367" font-size="13" fill="#98621e" font-weight="700">F6G</text>
<text x="898" y="1397" font-size="21" fill="#233646" font-weight="600">What the demonstration does not prove</text>
<text x="898" y="1424" font-size="13" fill="#5c6d7c" font-weight="400">chat claim validation + visible limitations</text>
<text x="898" y="1451" font-size="16" fill="#233646" font-weight="400">Exact quotes improve traceability, not medical truth.</text>
<text x="898" y="1475" font-size="16" fill="#233646" font-weight="400">Missing records do not prove an event never happened.</text>
</g>
<polyline data-edge="true" points="788,1405 876,1405" fill="none" stroke="#98621e" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="48" y="1548" font-size="14" fill="#5c6d7c" font-weight="400">Zoom index: docs/code-walkthrough.md · Search a node ID such as #B6 in the source.</text>
</svg>
